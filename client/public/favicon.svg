<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="goblinSkin" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </radialGradient>
  </defs>

  <!-- Dark Atmospheric Badge Background -->
  <rect width="32" height="32" rx="7" fill="url(#darkBg)" stroke="#292524" stroke-width="1.2"/>

  <!-- Goblin Pointy Left Ear -->
  <polygon points="12,12 2,7 8,17" fill="#15803d" stroke="#14532d" stroke-width="0.8" stroke-linejoin="round"/>
  <polygon points="11,13 4,9 8,16" fill="#86efac" opacity="0.6"/>

  <!-- Goblin Pointy Right Ear -->
  <polygon points="20,12 30,7 24,17" fill="#15803d" stroke="#14532d" stroke-width="0.8" stroke-linejoin="round"/>
  <polygon points="21,13 28,9 24,16" fill="#86efac" opacity="0.6"/>

  <!-- Goblin Head / Face -->
  <ellipse cx="16" cy="15.5" rx="7.5" ry="6.5" fill="url(#goblinSkin)" stroke="#14532d" stroke-width="0.8"/>

  <!-- Beady Glowing Amber Eyes -->
  <ellipse cx="13" cy="14.5" rx="1.6" ry="1.4" fill="#fbbf24"/>
  <circle cx="13.2" cy="14.5" r="0.7" fill="#451a03"/>
  <circle cx="12.8" cy="14.1" r="0.4" fill="#ffffff"/>

  <ellipse cx="19" cy="14.5" rx="1.6" ry="1.4" fill="#fbbf24"/>
  <circle cx="18.8" cy="14.5" r="0.7" fill="#451a03"/>
  <circle cx="18.6" cy="14.1" r="0.4" fill="#ffffff"/>

  <!-- Goblin Snout / Grin -->
  <path d="M14.5 17.2 Q16 18.2 17.5 17.2" stroke="#14532d" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <path d="M12.5 18.5 Q16 21 19.5 18.5" stroke="#052e16" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Pointy Tooth -->
  <polygon points="17.2,19.2 18.2,19.2 17.7,20.8" fill="#fef08a"/>

  <!-- Shiny Hoarded Gold Coin (Held in front) -->
  <circle cx="21.5" cy="23.5" r="5.2" fill="url(#goldCoin)" stroke="#a16207" stroke-width="0.8"/>
  <circle cx="21.5" cy="23.5" r="3.8" fill="none" stroke="#eab308" stroke-width="0.6" stroke-dasharray="1.2,0.8"/>
  <text x="21.5" y="25.5" font-size="5" font-weight="900" font-family="monospace" fill="#713f12" text-anchor="middle">G</text>
  <!-- Coin Sparkle -->
  <polygon points="19.2,20.2 20,20.8 19.4,21.6 18.8,21" fill="#ffffff" opacity="0.9"/>
</svg>